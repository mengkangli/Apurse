name: apurse
description: Apurse - A beautiful personal finance tracker.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  shared_preferences: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  fl_chart: ^0.70.2
  csv: ^6.0.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  http: ^1.3.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
